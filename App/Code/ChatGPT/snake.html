<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT - Snake Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      padding: 20px;
    }
    h1 { margin: 0; }
    #score { font-size: 18px; }
    canvas {
      width: min(90vw, 500px);
      height: min(90vw, 500px);
      background: #0b1220;
      border: 3px solid white;
      image-rendering: pixelated;
    }
    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    #message { min-height: 20px; }
  </style>
</head>
<body>
  <h1>Snake Game</h1>
  <div id="score">Score: 0</div>
  <canvas id="game" width="500" height="500"></canvas>
  <button id="restart">Restart</button>
  <div id="message"></div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const messageEl = document.getElementById("message");
    const restartButton = document.getElementById("restart");

    const grid = 20;
    const tile = canvas.width / grid;
    let snake, food, direction, nextDirection, score, gameOver, timer;

    function reset() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      messageEl.textContent = "";
      food = createFood();
      scoreEl.textContent = "Score: 0";
      clearInterval(timer);
      timer = setInterval(update, 110);
      draw();
    }

    function createFood() {
      let spot;
      do {
        spot = {
          x: Math.floor(Math.random() * grid),
          y: Math.floor(Math.random() * grid)
        };
      } while (snake.some(part => part.x === spot.x && part.y === spot.y));
      return spot;
    }

    function update() {
      if (gameOver) return;

      direction = nextDirection;
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      if (
        head.x < 0 || head.x >= grid ||
        head.y < 0 || head.y >= grid ||
        snake.some(part => part.x === head.x && part.y === head.y)
      ) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = "Score: " + score;
        food = createFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);
      messageEl.textContent = "Game Over! Press Restart to play again.";
      draw();
    }

    function draw() {
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ef4444";
      ctx.fillRect(food.x * tile, food.y * tile, tile - 1, tile - 1);

      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#22c55e" : "#16a34a";
        ctx.fillRect(part.x * tile, part.y * tile, tile - 1, tile - 1);
      });
    }

    document.addEventListener("keydown", event => {
      const keys = {
        ArrowUp: { x: 0, y: -1 },
        w: { x: 0, y: -1 },
        W: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        s: { x: 0, y: 1 },
        S: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        a: { x: -1, y: 0 },
        A: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 },
        d: { x: 1, y: 0 },
        D: { x: 1, y: 0 }
      };

      const requested = keys[event.key];
      if (!requested) return;

      event.preventDefault();

      if (requested.x === -direction.x && requested.y === -direction.y) return;
      nextDirection = requested;
    });

    restartButton.addEventListener("click", reset);
    reset();
  </script>
</body>
</html>
