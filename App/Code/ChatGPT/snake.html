<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT - Snake Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      padding: 20px;
    }
    h1 { margin: 0; }
    #score { font-size: 20px; font-weight: 700; }
    .game-wrap {
      position: relative;
      width: min(90vw, 500px);
      aspect-ratio: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0b1220;
      border: 3px solid white;
      image-rendering: pixelated;
    }
    #gameOverOverlay {
      position: absolute;
      inset: 3px;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: rgba(0, 0, 0, 0.72);
      text-align: center;
    }
    #gameOverOverlay.show { display: flex; }
    #gameOverOverlay h2 {
      margin: 0;
      font-size: clamp(30px, 8vw, 48px);
    }
    #finalScore {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    #restart {
      padding: 11px 22px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
    }
    #mobileControls {
      display: none;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(2, 58px);
      gap: 8px;
      touch-action: manipulation;
      user-select: none;
    }
    #mobileControls button {
      width: 58px;
      height: 58px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      font-size: 24px;
      font-weight: bold;
      background: #374151;
      color: white;
      touch-action: manipulation;
    }
    #mobileControls button:active { transform: scale(0.94); }
    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }
    @media (max-width: 700px), (pointer: coarse) {
      #mobileControls { display: grid; }
      .game-wrap { width: min(90vw, 420px); }
      button { -webkit-tap-highlight-color: transparent; }
    }
  </style>
</head>
<body>
  <h1>Snake Game</h1>
  <div id="score">Score: 0</div>

  <div class="game-wrap">
    <canvas id="game" width="500" height="500"></canvas>
    <div id="gameOverOverlay">
      <h2>Game Over</h2>
      <p id="finalScore">Score: 0</p>
      <button id="restart">Restart</button>
    </div>
  </div>

  <div id="mobileControls" aria-label="Snake mobile controls">
    <button id="up" aria-label="Move up">▲</button>
    <button id="left" aria-label="Move left">◀</button>
    <button id="down" aria-label="Move down">▼</button>
    <button id="right" aria-label="Move right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const gameOverOverlay = document.getElementById("gameOverOverlay");
    const finalScoreEl = document.getElementById("finalScore");
    const restartButton = document.getElementById("restart");

    const grid = 20;
    const tile = canvas.width / grid;
    let snake, food, direction, nextDirection, score, gameOver, timer;

    function reset() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      scoreEl.textContent = "Score: 0";
      finalScoreEl.textContent = "Score: 0";
      gameOverOverlay.classList.remove("show");
      food = createFood();
      clearInterval(timer);
      timer = setInterval(update, 110);
      draw();
    }

    function createFood() {
      let spot;
      do {
        spot = {
          x: Math.floor(Math.random() * grid),
          y: Math.floor(Math.random() * grid)
        };
      } while (snake.some(part => part.x === spot.x && part.y === spot.y));
      return spot;
    }

    function update() {
      if (gameOver) return;

      direction = nextDirection;
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      if (
        head.x < 0 || head.x >= grid ||
        head.y < 0 || head.y >= grid ||
        snake.some(part => part.x === head.x && part.y === head.y)
      ) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = "Score: " + score;
        food = createFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);
      finalScoreEl.textContent = "Score: " + score;
      gameOverOverlay.classList.add("show");
      draw();
    }

    function draw() {
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ef4444";
      ctx.fillRect(food.x * tile, food.y * tile, tile - 1, tile - 1);

      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#22c55e" : "#16a34a";
        ctx.fillRect(part.x * tile, part.y * tile, tile - 1, tile - 1);
      });
    }

    document.addEventListener("keydown", event => {
      const keys = {
        ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 }
      };

      const requested = keys[event.key];
      if (!requested || gameOver) return;
      event.preventDefault();

      if (requested.x === -direction.x && requested.y === -direction.y) return;
      nextDirection = requested;
    });

    function changeDirection(requested) {
      if (gameOver) return;
      if (requested.x === -direction.x && requested.y === -direction.y) return;
      nextDirection = requested;
    }

    function bindMobileButton(id, requested) {
      document.getElementById(id).addEventListener("pointerdown", event => {
        event.preventDefault();
        changeDirection(requested);
      });
    }

    bindMobileButton("up", { x: 0, y: -1 });
    bindMobileButton("down", { x: 0, y: 1 });
    bindMobileButton("left", { x: -1, y: 0 });
    bindMobileButton("right", { x: 1, y: 0 });

    restartButton.addEventListener("click", reset);
    reset();
  </script>
</body>
</html>
