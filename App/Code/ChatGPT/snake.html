<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Snake</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .game {
      width: min(92vw, 540px);
      text-align: center;
    }
    h1 { margin: 0 0 8px; }
    #score { margin-bottom: 14px; font-size: 18px; }
    canvas {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      background: #0b1220;
      border: 3px solid #fff;
      border-radius: 8px;
      image-rendering: pixelated;
    }
    button {
      margin-top: 14px;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }
    #message { min-height: 24px; margin-top: 10px; }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
    }
    .controls button { margin: 0; padding: 12px; }
    .up { grid-column: 2; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <main class="game">
    <h1>🐍 Snake</h1>
    <div id="score">Score: 0</div>
    <canvas id="game" width="500" height="500"></canvas>
    <button id="restart" type="button">Restart</button>
    <div id="message"></div>
    <div class="controls" aria-label="Snake controls">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="down" data-dir="down">▼</button>
      <button class="right" data-dir="right">▶</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const messageEl = document.getElementById("message");
    const restartButton = document.getElementById("restart");

    const grid = 20;
    const tile = canvas.width / grid;
    let snake, food, direction, nextDirection, score, gameOver, timer;

    function reset() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      messageEl.textContent = "Use Arrow Keys or WASD to move.";
      placeFood();
      scoreEl.textContent = "Score: 0";
      clearInterval(timer);
      timer = setInterval(update, 110);
      draw();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * grid),
          y: Math.floor(Math.random() * grid)
        };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function setDirection(name) {
      const dirs = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      const next = dirs[name];
      if (!next || (next.x === -direction.x && next.y === -direction.y)) return;
      nextDirection = next;
    }

    function update() {
      if (gameOver) return;

      direction = nextDirection;
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      if (
        head.x < 0 || head.x >= grid ||
        head.y < 0 || head.y >= grid ||
        snake.some(part => part.x === head.x && part.y === head.y)
      ) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = "Score: " + score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);
      messageEl.textContent = "Game Over! Press Restart to play again.";
      draw();
    }

    function draw() {
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ef4444";
      ctx.fillRect(food.x * tile + 3, food.y * tile + 3, tile - 6, tile - 6);

      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#22c55e" : "#16a34a";
        ctx.fillRect(part.x * tile + 2, part.y * tile + 2, tile - 4, tile - 4);
      });
    }

    document.addEventListener("keydown", event => {
      const keys = {
        ArrowUp: "up", w: "up", W: "up",
        ArrowDown: "down", s: "down", S: "down",
        ArrowLeft: "left", a: "left", A: "left",
        ArrowRight: "right", d: "right", D: "right"
      };
      if (keys[event.key]) {
        event.preventDefault();
        setDirection(keys[event.key]);
      }
    });

    document.querySelectorAll(".controls button").forEach(button => {
      button.addEventListener("click", () => setDirection(button.dataset.dir));
    });

    restartButton.addEventListener("click", reset);
    reset();
  </script>
</body>
</html>
